name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `dev` pulls in `train` (datasets, etc.) via a self-reference, since
      # tests/test_finetune_lora.py imports train.finetune_lora, which needs
      # `datasets` -- everything else under test is import-light on purpose.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest
